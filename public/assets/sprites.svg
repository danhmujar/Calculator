<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <defs>
    <!-- 1. Calculator Header Icon -->
    <symbol id="icon-calc" viewBox="15 5 70 90">
      <rect width="60" height="80" x="20" y="10" fill="var(--primary-blue)" class="calculator-body" rx="8" ry="8"/>
      <rect width="50" height="25" x="25" y="15" fill="#f8fafc" rx="4" ry="4"/>
      <g class="eye">
        <circle cx="38" cy="27" r="7" fill="#fff" stroke="#334155" stroke-width="2"/>
        <circle cx="38" cy="27" r="3" fill="#334155" class="pupil pupil-1" id="pupil1"/>
      </g>
      <g class="eye">
        <circle cx="62" cy="27" r="7" fill="#fff" stroke="#334155" stroke-width="2"/>
        <circle cx="62" cy="27" r="3" fill="#334155" class="pupil pupil-2" id="pupil2"/>
      </g>
      <g fill="#fff" opacity=".8">
        <rect width="8" height="8" x="28" y="48" rx="2"/><rect width="8" height="8" x="42" y="48" rx="2"/><rect width="8" height="8" x="56" y="48" rx="2"/><rect width="8" height="8" x="70" y="48" rx="2"/>
        <rect width="8" height="8" x="28" y="62" rx="2"/><rect width="8" height="8" x="42" y="62" rx="2"/><rect width="8" height="8" x="56" y="62" rx="2"/><rect width="8" height="8" x="70" y="62" rx="2"/>
        <rect width="22" height="8" x="28" y="76" rx="2"/><rect width="8" height="8" x="56" y="76" rx="2"/><rect width="8" height="8" x="70" y="76" fill="#fcd34d" opacity="1" rx="2"/>
      </g>
    </symbol>

    <!-- 2. Palette Icon -->
    <symbol id="icon-palette" viewBox="0 0 24 24">
      <path fill="#e2e8f0" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10c1.02 0 1.5-.48 1.5-1.5 0-.48-.2-.94-.52-1.28A1.996 1.996 0 0 1 13.5 16H16c3.31 0 6-2.69 6-6s-2.69-6-6-6z"/>
      <circle cx="13.5" cy="6.5" r="2.5" fill="#ef4444"/><circle cx="17.5" cy="10.5" r="2.5" fill="#3b82f6"/><circle cx="8.5" cy="7.5" r="2.5" fill="#eab308"/><circle cx="6.5" cy="12.5" r="2.5" fill="#10b981"/><circle cx="16" cy="17" r="1.5" fill="#cbd5e1"/>
    </symbol>

    <!-- 3. Day Clouds -->
    <symbol id="icon-clouds" viewBox="0 0 68 34">
      <path fill="#bae6fd" d="M28 34c0-14 12-20 20-16 6-8 18-6 20 2v14Z" opacity=".6"/>
      <path fill="#e0f2fe" d="M34 34c0-10 10-14 16-10 8-8 18-6 18 2v8Z" opacity=".8"/>
      <path fill="#fff" d="M40 34c0-8 10-10 14-6 6-6 14-4 14 2v4Z" opacity=".95"/>
      <path fill="#fff" d="M24 34c0-4 6-6 10-2 4-4 10-2 12 2Z" opacity=".85"/>
    </symbol>

    <!-- 4. Night Stars -->
    <symbol id="icon-stars" viewBox="0 0 68 34">
      <path fill="#fcd34d" d="m16 10 1.5 4 4 1.5-4 1.5-1.5 4-1.5-4-4-1.5 4-1.5Z"/>
      <path fill="#fef3c7" d="m30 6 .5 2 2 .5-2 .5-.5 2-.5-2-2-.5 2-.5Z"/>
      <circle cx="8" cy="12" r="1" fill="#fff"/><circle cx="24" cy="22" r="1.5" fill="#fcd34d"/><circle cx="12" cy="24" r="1" fill="#fff"/>
    </symbol>

    <!-- 5. Sun Details -->
    <symbol id="icon-sun" viewBox="0 0 32 32">
      <path stroke="currentColor" stroke-linecap="round" stroke-width="2.5" d="M16 1.5V4m0 24v2.5M1.5 16H4m24 0h2.5M5.5 5.5l2 2m17 17 2 2m-21 0 2-2m17-17 2-2"/>
    </symbol>

    <!-- 6. Moon Details -->
    <symbol id="icon-moon" viewBox="0 0 24 24">
      <path fill="currentColor" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79"/>
    </symbol>

    <!-- 7. Plus Icon -->
    <symbol id="icon-plus" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v14m-7-7h14"/>
    </symbol>

    <!-- 8. Offline Icon -->
    <symbol id="icon-offline" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="m1 1 22 22m-6.28-11.94A11 11 0 0 1 19 12.55m-14 0a10.94 10.94 0 0 1 5.17-2.39m.54-5.11A16 16 0 0 1 22.56 9M1.42 9a15.9 15.9 0 0 1 4.7-2.88m2.41 9.99a6 6 0 0 1 6.95 0M12 20h.01"/>
    </symbol>

    <!-- 9. History Icon -->
    <symbol id="icon-history" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
      <path stroke="#4338ca" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6l4 2"/>
      <circle cx="12" cy="12" r="1.5" fill="#4338ca"/>
    </symbol>

    <!-- 10. Close Sidebar Icon -->
    <symbol id="icon-close" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 6 6 18M6 6l12 12"/>
    </symbol>

    <!-- 11. Chevron Left Icon -->
    <symbol id="icon-chevron-left" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m15 18-6-6 6-6"/>
    </symbol>

    <!-- 12. Trash Icon -->
    <symbol id="icon-trash" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 6h18m-2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
    </symbol>

    <!-- 13. Smartphone Icon -->
    <symbol id="icon-smartphone" viewBox="0 0 24 24">
      <rect width="16" height="20" x="4" y="2" rx="3" ry="3" fill="none" stroke="currentColor" stroke-width="2"/>
      <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 5h4M9 17h6"/>
    </symbol>

    <!-- 14. Close X (Bold) -->
    <symbol id="icon-x" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M18 6 6 18M6 6l12 12"/>
    </symbol>

    <!-- 15. Code Icon -->
    <symbol id="icon-code" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m16 18 6-6-6-6M8 6l-6 6 6 6"/>
    </symbol>

    <!-- 16. Shield Icon -->
    <symbol id="icon-shield" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/>
    </symbol>

    <!-- 17. Check Circle Icon -->
    <symbol id="icon-check-circle" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m9 11 3 3L22 4"/><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
    </symbol>

    <!-- 18. Alert Circle Icon -->
    <symbol id="icon-alert-circle" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01"/>
    </symbol>

    <!-- 19. Download Icon -->
    <symbol id="icon-download" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4m4-5 5 5 5-5m-5 5V3"/>
    </symbol>

    <!-- 20. Clipboard Icon -->
    <symbol id="icon-clipboard" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/>
    </symbol>

    <!-- 21. Copy Icon (Dynamic) -->
    <symbol id="icon-copy" viewBox="0 0 24 24">
      <rect x="9" y="9" width="13" height="13" rx="2" ry="2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <!-- 22. Delete Row Icon (Dynamic X) -->
    <symbol id="icon-delete" viewBox="0 0 24 24">
      <line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <!-- 23. Calculator FAB Icon -->
    <symbol id="icon-calc-fab" viewBox="0 0 24 24">
      <rect width="16" height="20" x="4" y="2" rx="2" ry="2" fill="none" stroke="currentColor" stroke-width="2"/>
      <line x1="7" y1="6" x2="17" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <g stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <path d="M7 11h3.5M8.75 9.25v3.5"/>
        <line x1="14" y1="11" x2="17" y2="11"/>
        <path d="M7 16l3 3m0-3l-3 3"/>
        <path d="M14 16l3 3M14.5 16.5a.5.5 0 1 1 0 .01M16.5 18.5a.5.5 0 1 1 0 .01" stroke-width="1.2"/>
      </g>
    </symbol>

  </defs>
</svg>
